name: Docker Build CI

on:
  pull_request:
    branches:
      - develop

  push:
    branches:
      - develop

jobs:
  docker-build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: services/auth-service

          - service: workout-service
            context: services/workout-service

          - service: meal-service
            context: services/meal-service

          - service: calculator-service
            context: services/calculator-service

          - service: dashboard-service
            context: services/dashboard-service

          - service: frontend
            context: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: |
          docker build -t fitnesstracker-${{ matrix.service }}:ci ${{ matrix.context }}

      - name: Report HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fitnesstracker-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "0"

      - name: Enforce CRITICAL vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fitnesstracker-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "1"
          skip-steup-trivy: true
