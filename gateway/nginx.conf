worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    upstream auth_service       { server auth-service:8000; }
    upstream workout_service    { server workout-service:8000; }
    upstream meal_service       { server meal-service:8000; }
    upstream calculator_service { server calculator-service:8000; }
    upstream dashboard_service  { server dashboard-service:8000; }
    upstream frontend           { server frontend:80; }

    server {
        listen 80;

        # --- API routes: strip the /api/<service> prefix, forward to the service ---
        location /api/auth/ {
            rewrite ^/api/auth/(.*)$ /$1 break;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
        }

        location /api/workouts/ {
            rewrite ^/api/workouts/(.*)$ /workouts/$1 break;
            proxy_pass http://workout_service;
            proxy_set_header Host $host;
        }
        location = /api/workouts {
            proxy_pass http://workout_service/workouts;
            proxy_set_header Host $host;
        }
        location /api/exercise-options {
            proxy_pass http://workout_service/exercise-options;
            proxy_set_header Host $host;
        }

        location /api/meals/ {
            rewrite ^/api/meals/(.*)$ /meals/$1 break;
            proxy_pass http://meal_service;
            proxy_set_header Host $host;
        }
        location = /api/meals {
            proxy_pass http://meal_service/meals;
            proxy_set_header Host $host;
        }
        location /api/meal-options {
            proxy_pass http://meal_service/meal-options;
            proxy_set_header Host $host;
        }

        location /api/calculator/ {
            rewrite ^/api/calculator/(.*)$ /$1 break;
            proxy_pass http://calculator_service;
            proxy_set_header Host $host;
        }

        location /api/dashboard {
            proxy_pass http://dashboard_service/dashboard;
            proxy_set_header Host $host;
        }

        # --- Static frontend for everything else ---
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}
